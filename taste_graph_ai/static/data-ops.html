<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据运营 · TasteGraph AI</title>
<link rel="stylesheet" href="/css/app.css?v=3">
<style>
  :root {
    --ink: #1f3d33;
    --ink-soft: #4a5f57;
    --line: #dfe3e0;
    --bg: #ffffff;
    --bg-soft: #f4f6f5;
    --warn-bg: #fdf3e7;
    --warn-line: #d9a441;
    --muted: #8a938e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-soft);
    color: #24302b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .ops-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .ops-header h1 {
    margin: 0;
    font-size: 18px;
    color: var(--ink);
  }
  .ops-header .back {
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
  }
  .ops-header .back:hover { border-color: var(--ink); }
  .ops-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .assembled { font-size: 12px; color: var(--ink-soft); }
  .btn {
    font: inherit;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  .btn:hover { background: #2c5246; }
  .btn:focus-visible { outline: 2px solid #2c5246; outline-offset: 2px; }
  .banner {
    display: none;
    margin: 16px 20px 0;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    border: 1px solid var(--warn-line);
    background: var(--warn-bg);
    color: #6b4e16;
  }
  .banner.show { display: block; }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr));
    gap: 16px;
    align-items: start;
    padding: 20px;
  }
  section.ops-card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  section.ops-card.stale { border-color: var(--warn-line); }
  .card-title {
    margin: 0 0 4px;
    font-size: 15px;
    color: var(--ink);
  }
  .asof {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    word-break: break-all;
  }
  .chip {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  .chip.warn { border-color: var(--warn-line); background: var(--warn-bg); color: #8a5a12; }
  .chip.fail { border-color: #c0564b; background: #fbeae8; color: #8f2f27; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  th { border-top: none; color: var(--muted); font-weight: 500; }
  td.value { font-variant-numeric: tabular-nums; white-space: nowrap; color: #18241f; }
  td.value.unknown { color: var(--muted); }
  table, tbody { display: block; }
  tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-top: 1px solid var(--line); padding: 6px 0; }
  td { border: 0; padding: 2px 4px; overflow-wrap: anywhere; }
  td.note { grid-column: 1 / -1; color: var(--ink-soft); font-size: 12px; }
  td.note:empty { display: none; }
  @media (max-width: 480px) {
    .ops-meta { margin-left: 0; width: 100%; }
    main { padding: 12px; }
  }
</style>
</head>
<body>
<header class="ops-header">
  <h1>数据运营（只读视图）</h1>
  <a class="back" href="/">← 返回主页</a>
  <div class="ops-meta">
    <span class="assembled">快照组装时间：<strong id="assembled-at">未知</strong></span>
    <button id="refresh-btn" class="btn" type="button">⟳ 刷新（只读）</button>
  </div>
</header>
<div id="ops-banner" class="banner" role="status"></div>
<main id="ops-sections"></main>
<script src="/js/data-ops.js?v=1"></script>
</body>
</html>

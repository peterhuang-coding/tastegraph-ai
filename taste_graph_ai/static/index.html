<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>moodboard.</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=1">
<link rel="stylesheet" href="/css/app.css?v=3">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1 class="app-title">moodboard.</h1>
    <span class="app-subtitle">A personal visual sampler · 52 sources · 9 images per pack</span>
    <div class="header-actions">
      <button id="refresh-btn" class="btn btn-ghost btn-sm" title="刷新数据 (Cmd+R)">⟳ 刷新</button>
      <span id="health-indicator" class="health-dot" title="系统状态">●</span>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="home">☀️ 今日</button>
    <button class="tab-btn" data-tab="weekly">📊 反馈周报</button>
    <button id="admin-toggle" class="tab-btn admin-toggle" title="显示/隐藏调试 tab" aria-expanded="false">⚙ 调试 ▾</button>
  </nav>

  <div id="admin-section" class="admin-section" hidden>
    <div class="admin-section-label">调试 / 系统</div>
    <div class="admin-section-tabs">
      <button class="tab-btn admin-tab-btn" data-tab="trend">🔥 趋势</button>
      <button class="tab-btn admin-tab-btn" data-tab="graph">品味图谱</button>
      <button class="tab-btn admin-tab-btn" data-tab="tasks">📋 任务</button>
      <button class="tab-btn admin-tab-btn" data-tab="crawler">🕷 爬虫</button>
      <button class="tab-btn admin-tab-btn" data-tab="health">🩺 健康</button>
    </div>
  </div>

  <div class="task-bar" id="task-bar"></div>

  <main class="content">
    <section id="tab-home" class="tab-panel active"></section>
    <section id="tab-sources" class="tab-panel admin-panel hidden"></section>
    <section id="tab-daily" class="tab-panel admin-panel hidden"></section>
    <section id="tab-graph" class="tab-panel admin-panel hidden"></section>
    <section id="tab-history" class="tab-panel admin-panel hidden"></section>
    <section id="tab-curation" class="tab-panel admin-panel hidden"></section>
    <section id="tab-health" class="tab-panel admin-panel hidden"></section>
    <section id="tab-pipeline" class="tab-panel admin-panel hidden"></section>
    <section id="tab-crawler" class="tab-panel admin-panel hidden"></section>
    <section id="tab-tasks" class="tab-panel admin-panel hidden"></section>
    <section id="tab-weekly" class="tab-panel hidden"></section>
    <section id="tab-trend" class="tab-panel admin-panel hidden"></section>
  </main>

  <div id="toast-container"></div>
  <div id="image-modal-overlay" class="modal-overlay" style="display:none"></div>
</div>

<script src="/js/home.js?v=4"></script>
<script src="/js/app.js?v=5"></script>
<script src="/js/sources.js?v=3"></script>
<script src="/js/daily.js?v=3"></script>
<script src="/js/graph.js?v=3"></script>
<script src="/js/tasks.js?v=4"></script>
<script src="/js/history.js?v=3"></script>
<script src="/js/curation.js?v=1"></script>
<script src="/js/health.js?v=1"></script>
<script src="/js/pipeline.js?v=1"></script>
<script src="/js/crawler.js?v=1"></script>
<script src="/js/weekly.js?v=1"></script>
<script src="/js/trend.js?v=1"></script>
<script>App.init();</script>
<style>
.tab-panel.hidden { display: none !important; }
.tab-panel.active { display: block; }

.admin-toggle { margin-left: auto; opacity: 0.7; font-size: 12px; padding: 4px 10px; }
.admin-toggle:hover { opacity: 1; }
.admin-toggle[aria-expanded="true"] {
  background: var(--accent);
  color: white;
  opacity: 1;
}

.admin-section {
  padding: 10px 24px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.admin-section-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.admin-section-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.admin-tab-btn {
  padding: 5px 12px;
  font-size: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.15s;
}
.admin-tab-btn:hover {
  color: var(--text);
  border-color: var(--accent);
  background: var(--bg-card);
}
.admin-tab-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.home-block h3 {
  color: var(--text);
}
.home-empty-state, .home-empty-mini {
  color: var(--text-muted);
}

@media (prefers-color-scheme: dark) {
  .admin-section { background: rgba(255,255,255,0.02); }
}
</style>
<script>
document.getElementById('admin-toggle')?.addEventListener('click', () => {
  const section = document.getElementById('admin-section');
  const toggle = document.getElementById('admin-toggle');
  const isOpen = !section.hasAttribute('hidden');
  if (isOpen) {
    section.setAttribute('hidden', '');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.textContent = '⚙ 调试 ▾';
  } else {
    section.removeAttribute('hidden');
    toggle.setAttribute('aria-expanded', 'true');
    toggle.textContent = '⚙ 调试 ▴';
  }
});
</script>
</body>
</html>

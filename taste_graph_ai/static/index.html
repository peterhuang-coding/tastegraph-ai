<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteGraph AI</title>
<link rel="stylesheet" href="/css/app.css?v=3">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1 class="app-title">TasteGraph AI</h1>
    <span class="app-subtitle">品味知识图谱 + 推荐引擎</span>
    <div class="header-actions">
      <button id="refresh-btn" class="btn btn-ghost btn-sm" title="刷新数据 (Cmd+R)">⟳ 刷新</button>
      <span id="health-indicator" class="health-dot" title="系统状态">●</span>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="home">☀️ 今日</button>
    <button class="tab-btn admin-tab hidden" data-tab="sources">发现源审核 <span id="sources-badge" class="badge hidden">0</span></button>
    <button class="tab-btn admin-tab hidden" data-tab="daily">今日推荐</button>
    <button class="tab-btn admin-tab hidden" data-tab="graph">品味图谱</button>
    <button class="tab-btn admin-tab hidden" data-tab="history">发布历史</button>
    <button class="tab-btn admin-tab hidden" data-tab="curation">手动选图</button>
    <button class="tab-btn admin-tab hidden" data-tab="health">🩺 健康</button>
    <button class="tab-btn admin-tab hidden" data-tab="pipeline">⚙️ Pipeline</button>
    <button class="tab-btn admin-tab hidden" data-tab="crawler">🕷 爬虫</button>
    <button class="tab-btn admin-tab hidden" data-tab="tasks">📋 任务</button>
    <button class="tab-btn" data-tab="weekly">📊 反馈周报</button>
    <button id="admin-toggle" class="tab-btn admin-toggle" title="显示/隐藏系统 tab">⚙️ 系统</button>
    <button class="tab-btn admin-tab hidden" data-tab="trend">🔥 潮流</button>
  </nav>

  <div class="task-bar" id="task-bar"></div>

  <main class="content">
    <section id="tab-home" class="tab-panel active"></section>
    <section id="tab-sources" class="tab-panel admin-panel hidden"></section>
    <section id="tab-daily" class="tab-panel admin-panel hidden"></section>
    <section id="tab-graph" class="tab-panel admin-panel hidden"></section>
    <section id="tab-history" class="tab-panel admin-panel hidden"></section>
    <section id="tab-curation" class="tab-panel admin-panel hidden"></section>
    <section id="tab-health" class="tab-panel admin-panel hidden"></section>
    <section id="tab-pipeline" class="tab-panel admin-panel hidden"></section>
    <section id="tab-crawler" class="tab-panel admin-panel hidden"></section>
    <section id="tab-tasks" class="tab-panel admin-panel hidden"></section>
    <section id="tab-weekly" class="tab-panel"></section>
    <section id="tab-trend" class="tab-panel admin-panel hidden"></section>
  </main>

  <div id="toast-container"></div>
  <div id="image-modal-overlay" class="modal-overlay" style="display:none"></div>
</div>

<script src="/js/home.js?v=2"></script>
<script src="/js/app.js?v=5"></script>
<script src="/js/sources.js?v=3"></script>
<script src="/js/daily.js?v=3"></script>
<script src="/js/graph.js?v=3"></script>
<script src="/js/tasks.js?v=4"></script>
<script src="/js/history.js?v=3"></script>
<script src="/js/curation.js?v=1"></script>
<script src="/js/health.js?v=1"></script>
<script src="/js/pipeline.js?v=1"></script>
<script src="/js/crawler.js?v=1"></script>
<script src="/js/weekly.js?v=1"></script>
<script src="/js/trend.js?v=1"></script>
<script>App.init();</script>
<style>
.tab-btn.admin-tab.hidden, .tab-panel.admin-panel.hidden { display: none !important; }
.tab-btn.admin-toggle { margin-left: auto; opacity: 0.6; font-size: 12px; padding: 4px 10px; }
.tab-btn.admin-toggle:hover { opacity: 1; }
</style>
<script>
document.getElementById('admin-toggle')?.addEventListener('click', () => {
  const all = document.querySelectorAll('.admin-tab, .admin-panel');
  const anyVisible = [...all].some(el => !el.classList.contains('hidden'));
  all.forEach(el => el.classList.toggle('hidden', anyVisible));
});
</script>
</body>
</html>

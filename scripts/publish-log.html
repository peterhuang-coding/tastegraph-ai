<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发布登记 — moodboard.</title>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --ink:#2b2a28; --mut:#99948c; --line:#e5e0d8; --accent:#c9b8a3; }
  body { margin:0; font-family:-apple-system,"PingFang SC",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:1200px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:20px; }
  .form { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:24px; }
  .field { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mut); }
  input,select { border:1px solid var(--line); border-radius:4px; padding:7px 9px; font-size:13px; background:#fff; color:var(--ink); }
  input:focus { outline:none; border-color:var(--accent); }
  button { border:1px solid var(--line); background:#fff; border-radius:4px; padding:8px 14px; font-size:13px; cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th,td { text-align:left; padding:9px 10px; font-size:13px; border-bottom:1px solid var(--line); }
  th { font-weight:500; color:var(--mut); font-size:11px; letter-spacing:.04em; }
  td.num input { width:44px; }
  td.num .observed { width:185px; margin-top:6px; }
  .table-wrap { overflow:auto; }
  .sync-error { color:#b84a3a; font-size:12px; margin:6px 0; }
  #notice { margin-bottom:14px; font-size:13px; }
  td .del { color:#b84a3a; cursor:pointer; font-size:11px; }
  .sum { margin-top:12px; font-size:12px; color:var(--mut); }
  a { color:#666; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1b19; --card:#26241f; --ink:#e8e4dc; --mut:#8a857c; --line:#3a362f; --accent:#8a7a68; }
    input { background:#1c1b19; color:#e8e4dc; }
    button { background:#26241f; }
  }
</style>
<div class="wrap">
  <h1>📓 发布登记</h1>
  <div class="sub">登记实际发布状态；24h/48h 保存累计观测。未知时间可留空，互动数据不会自动改变审美偏好。← <a href="/">回工作台</a></div>

  <div class="form">
    <div class="field">发布包路径<input id="f-pack" placeholder="posts/2026-08-24/pack-001" style="width:230px"></div>
    <div class="field">状态<select id="f-status"><option value="unknown">未知</option><option value="under_review">审核中</option><option value="published">已发布</option><option value="draft">草稿</option><option value="rejected">审核未通过</option><option value="removed">已移除</option></select></div>
    <div class="field">发布时间（未知可留空）<input id="f-time" type="datetime-local" style="width:200px"></div>
    <div class="field">笔记链接<input id="f-link" placeholder="小红书笔记 URL（可选）" style="width:260px"></div>
    <div class="field">备注<input id="f-note" placeholder="选题/临时想法" style="width:180px"></div>
    <button class="primary" onclick="addEntry()">＋ 登记</button>
  </div>

  <div id="notice" role="status" aria-live="polite"></div>
  <div class="table-wrap"><table id="tbl">
    <thead><tr>
      <th>发布包</th><th>状态 / 发布时间</th><th>24h 赞/藏/评/浏览</th><th>48h 赞/藏/评/浏览</th><th>链接</th><th></th>
    </tr></thead>
    <tbody></tbody>
  </table></div>
  <div class="sum" id="sum"></div>
</div>

<script>
const tbl = document.getElementById('tbl').querySelector('tbody');
const statuses = {unknown:'未知',under_review:'审核中',published:'已发布',draft:'草稿',rejected:'审核未通过',removed:'已移除'};
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusOf(e){ const s=e.publication_status || e.status || e.platform_status || 'unknown'; return ['submitted_under_review','审核中'].includes(s) ? 'under_review' : (statuses[s] ? s : 'unknown'); }
function normalizeEntry(e){
  if(['审核中','under_review','submitted_under_review'].includes(e.platform_status) && !('submitted_at' in e) && e.published_at) return {...e, submitted_at:e.published_at, published_at:null};
  return e;
}
function localTime(value){
  if(!value) return '';
  const date = new Date(value);
  if(!Number.isFinite(date.getTime())) return '';
  return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);
}
function storedTime(value){ return value ? new Date(value).toISOString() : null; }
function options(value){ return Object.entries(statuses).map(([key,label]) => `<option value="${key}" ${key===value?'selected':''}>${label}</option>`).join(''); }
function metricFields(e, window){
  const inputs = [['l','赞'],['s','藏'],['c','评'],['v','浏览']].map(([prefix,label]) =>
    `<input type="number" min="0" step="1" aria-label="${window}h ${label}" value="${esc(e[prefix+window] ?? '')}" placeholder="${label}" onchange="upd('${esc(e.id)}','${prefix+window}',this.value)">`).join('');
  return inputs + `<br><label>观测时间（可留空）<br><input class="observed" type="datetime-local" value="${esc(localTime(e['observed_at'+window]))}" onchange="upd('${esc(e.id)}','observed_at${window}',storedTime(this.value))"></label>`;
}
function syncMessage(e){
  if(e.bridge && !e.bridge.ok) return `<div class="sync-error">${esc(e.bridge.error)} <button onclick="post({id:'${esc(e.id)}',retry_sync:true})">重试同步</button></div>`;
  return (e.bridge?.warnings || []).map(w => `<div class="sync-error">${esc(w)}</div>`).join('');
}
async function load(){
  try { const r = await fetch('/publish-entries'); const d = await r.json(); render(d.entries || []); }
  catch(e){ document.getElementById('notice').textContent = '登记列表加载失败：' + e.message; }
}
function render(entries){
  entries = entries.map(normalizeEntry);
  tbl.innerHTML = entries.map(e => `
    <tr data-id="${esc(e.id)}">
      <td>${esc(e.pack)}${e.note ? '<br><span style="color:var(--mut);font-size:11px">' + esc(e.note) + '</span>' : ''}${syncMessage(e)}</td>
      <td>${e.submitted_at ? '<div class="small">提交：' + esc(localTime(e.submitted_at).replace('T',' ')) + '</div>' : ''}<select aria-label="发布状态" onchange="upd('${esc(e.id)}','publication_status',this.value)">${options(statusOf(e))}</select><br><input type="datetime-local" aria-label="实际发布时间，未知可留空" title="实际发布时间；提交时间不会自动沿用" value="${esc(localTime(e.published_at))}" onchange="upd('${esc(e.id)}','published_at',storedTime(this.value))"></td>
      <td class="num">${metricFields(e,'24')}</td>
      <td class="num">${metricFields(e,'48')}</td>
      <td>${/^https?:\/\//.test(e.link || '') ? `<a href="${esc(e.link)}" target="_blank" rel="noopener noreferrer">打开</a>` : '—'}</td>
      <td><span class="del" onclick="del('${esc(e.id)}')">删除</span></td>
    </tr>`).join('');
  const now = Date.now(), weekAgo = now - 7*86400e3;
  const wk = entries.filter(e => { const t = e.published_at ? new Date(e.published_at).getTime() : NaN; return statusOf(e)==='published' && t > weekAgo && t <= now; });
  const latestLikes = e => e.l48 != null && e.l48 !== '' ? Number(e.l48) : Number(e.l24 || 0);
  const likes = wk.reduce((total,e) => total + latestLikes(e), 0);
  document.getElementById('sum').innerText = `近 7 天已发布 ${wk.length} 篇 · 最新已知累计赞 ${likes} · 累计登记 ${entries.length} 篇（仅统计状态与日期明确的发布）`;
}
async function post(payload){
  const notice = document.getElementById('notice');
  try {
    const r = await fetch('/publish-entries', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if(d.entries) render(d.entries);
    notice.textContent = d.ok ? '已保存并同步。' : (d.error || '保存失败');
    notice.style.color = d.ok ? 'var(--mut)' : '#b84a3a';
    return Boolean(d.ok || d.saved);
  } catch(e){ notice.textContent = '保存失败：' + e.message; return false; }
}
async function addEntry(){
  const pack = document.getElementById('f-pack').value.trim();
  if(!pack){ alert('填一下发布包路径'); return; }
  const saved = await post({pack, publication_status:document.getElementById('f-status').value,
    published_at:storedTime(document.getElementById('f-time').value),
    link:document.getElementById('f-link').value.trim(), note:document.getElementById('f-note').value.trim()});
  if(saved) ['f-pack','f-link','f-note','f-time'].forEach(id => document.getElementById(id).value = '');
}
function upd(id, key, val){ post({ id, [key]: val }); }
function del(id){ if(confirm('删除这条本地登记？已保存的历史观测会保留。')) post({ delete: id }); }
load();
</script>
